# ============================================================
# Bases de Datos 1 - Proyecto 2 (Fase 2)
# Comercial La Estrella - Infraestructura Docker
#
# Servicios:
#   sqlserver      -> Microsoft SQL Server 2022 (motor de base de datos)
#   sqlserver-init -> Contenedor de un solo uso que ejecuta init.sql
#                     automaticamente apenas sqlserver esta listo
#   api            -> API REST en Node.js / Express (unico punto de
#                     acceso a los datos, segun politica del DBA)
# ============================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: la_estrella_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-LaEstrella#2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - la_estrella_net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: la_estrella_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-LaEstrella#2026}"
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -I -i /init.sql"
    networks:
      - la_estrella_net

  api:
    build:
      context: ./api
    container_name: la_estrella_api
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: "${SA_PASSWORD:-LaEstrella#2026}"
      DB_DATABASE: ComercialLaEstrella
      PORT: 3000
    networks:
      - la_estrella_net

volumes:
  sqlserver_data:

networks:
  la_estrella_net:
    driver: bridge
